services:
  pumpkin-manager:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: pumpkin-manager:0.1.0
    container_name: pumpkin-manager
    ports:
      - "${PUMPKIN_MANAGER_HTTP_PORT:-8080}:8080"
    volumes:
      # Manager state (SQLite, server data roots, backups).
      - manager-data:/data
      # Privileged boundary: backend-only Docker control. The adapter needs
      # read/write Engine API access to create and manage child containers.
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    environment:
      PUMPKIN_MANAGER_HTTP_PORT: "8080"
      PUMPKIN_MANAGER_DATA_DIR: /data/servers
      PUMPKIN_MANAGER_BACKUP_DIR: /data/backups
      PUMPKIN_MANAGER_LOG_LEVEL: ${PUMPKIN_MANAGER_LOG_LEVEL:-info}
      PUMPKIN_MANAGER_DATABASE_URL: sqlite:/data/pumpkin-manager.db?mode=rwc
      PUMPKIN_INSECURE_COOKIES: ${PUMPKIN_INSECURE_COOKIES:-0}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The root-side entrypoint needs these capabilities to initialize a fresh
    # named /data volume and drop to the unprivileged app user.
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  # Pumpkins are NOT statically listed here in production — the manager
  # creates one container per server via the Docker API (see README).
  # This dev override runs a single disposable Pumpkin for recon testing:
  #   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml up

volumes:
  manager-data:

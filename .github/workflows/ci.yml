name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable (2026-10-16)
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt
      - run: cargo install cargo-audit --locked
      - run: cargo audit
      - run: cargo fmt --check
      - run: cargo clippy -p pumpkin-manager-backend -- -D warnings
      - run: cargo test -p pumpkin-manager-backend

  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npm audit --omit=dev --audit-level=high
        working-directory: apps/web

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [backend, web]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker build -f deploy/Dockerfile -t pumpkin-manager:ci .

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [backend, web]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable (2026-10-16)
        with:
          toolchain: 1.99.0
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: docker pull ghcr.io/pumpkin-mc/pumpkin:master
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: cargo build -p pumpkin-manager-backend
      - run: npx playwright test --config playwright.config.ts
        working-directory: apps/web
